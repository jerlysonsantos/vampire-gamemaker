version: "3.8"

services:
  oracle-db:
    image: container-registry.oracle.com/database/enterprise
    container_name: oracle-db
    environment:
      - ORACLE_SID=ORCL
      - ORACLE_PWD=MyStr_ngPassw0rd
    ports:
      - "1521:1521"
      - "5500:5500"
    volumes:
      - oracle-data:/opt/oracle/oradata
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

volumes:
  oracle-data:
